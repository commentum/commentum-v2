name: Deploy Supabase Backend
on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
  workflow_dispatch:
    inputs:
      deploy_functions:
        description: "Deploy Edge Functions"
        required: true
        default: "true"
      run_migrations:
        description: "Run database migrations"
        required: true
        default: "false"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Deploy Edge Functions
      - name: Deploy Edge Functions
        if: ${{ github.event_name == 'push' || inputs.deploy_functions == 'true' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          source: "supabase/functions/*"
          target: "/root/commentum/functions/"
          strip_components: 2

      # Restart edge functions container
      - name: Restart Edge Functions Container
        if: ${{ github.event_name == 'push' || inputs.deploy_functions == 'true' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -eo pipefail
            cd /root/commentum
            docker compose restart functions
            echo "✅ Edge functions restarted"

      # Copy migration directory to server
      # NOTE: runs on push too (not just manual dispatch) so that pushing
      # to supabase/migrations/** actually applies. `inputs` is undefined
      # on push events, which is why the old `inputs.run_migrations`
      # condition silently skipped these steps on every push.
      - name: Copy Migration Files
        if: ${{ github.event_name == 'push' || inputs.run_migrations == 'true' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          source: "supabase/migrations"
          target: "/root/commentum/"
          strip_components: 1

      # Run DB migrations
      # NOTE: every migration runs EXACTLY ONCE via the schema_migrations
      # tracking table. Re-running everything on every deploy was actively
      # destructive: 004 dropped the server_configs table (wiping Discord
      # webhooks/guild/role ids) and 028 reset app_owner_users, plus it
      # flooded logs with "already exists" errors.
      - name: Apply Database Migrations
        if: ${{ github.event_name == 'push' || inputs.run_migrations == 'true' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -eo pipefail
            cd /root/commentum
            docker compose ps -q db | grep -q . || { echo "❌ db container not found in $(pwd)"; exit 1; }
            MDIR=/root/commentum/migrations
            # commentum-db: postgres owns the functions/tables; supabase_admin
            # requires a password here, so use postgres over the local socket.
            PSQL="docker compose exec -T db psql -U postgres -d postgres -t -A"
            TRACKING_EXISTS=$($PSQL -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name='schema_migrations';")
            case "$TRACKING_EXISTS" in 0|1) ;; *) echo "❌ tracking check failed (got '$TRACKING_EXISTS')"; exit 1;; esac
            if [ "$TRACKING_EXISTS" = "0" ]; then
              echo "🆕 Creating schema_migrations tracking table"
              $PSQL -c "CREATE TABLE public.schema_migrations (filename TEXT PRIMARY KEY, applied_at TIMESTAMPTZ DEFAULT NOW());"
              # If the DB is already established (comments exists), every
              # migration currently in the folder has already been applied
              # by the old re-run-everything workflow — mark them as done
              # WITHOUT executing, so nothing destructive re-runs.
              # On a genuinely fresh DB (no comments table) we mark nothing
              # and the loop below performs the full first run.
              CORE_EXISTS=$($PSQL -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name='comments';")
              if [ "$CORE_EXISTS" = "1" ]; then
                echo "📦 Established DB detected — marking all existing migration files as applied"
                for f in $MDIR/*.sql; do
                  [ -f "$f" ] || continue
                  $PSQL -c "INSERT INTO public.schema_migrations (filename) VALUES ('$(basename $f)') ON CONFLICT (filename) DO NOTHING;"
                done
              fi
            fi
            ROWS=$($PSQL -c "SELECT count(*) FROM public.schema_migrations;")
            if [ "$ROWS" = "0" ]; then
              echo "❌ schema_migrations is empty — refusing to run, this would re-run destructive migrations"; exit 1
            fi
            for f in $MDIR/*.sql; do
              [ -f "$f" ] || continue
              BASE=$(basename "$f")
              APPLIED=$($PSQL -c "SELECT count(*) FROM public.schema_migrations WHERE filename='$BASE';")
              case "$APPLIED" in 0|1) ;; *) echo "❌ check failed for $BASE (got '$APPLIED')"; exit 1;; esac
              if [ "$APPLIED" = "0" ]; then
                echo "▶️ Running: $BASE"
                cat "$f" | docker compose exec -T db psql -U postgres -d postgres -v ON_ERROR_STOP=1
                $PSQL -c "INSERT INTO public.schema_migrations (filename) VALUES ('$BASE') ON CONFLICT (filename) DO NOTHING;"
              else
                echo "⏭️ Skipped (already applied): $BASE"
              fi
            done
            echo "✅ Migrations applied"

      # Verify
      - name: Verify Containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -eo pipefail
            cd /root/commentum
            docker compose ps
            echo "✅ Deploy complete"
