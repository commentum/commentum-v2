name = "commentum-v2-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "commentum-d1"
database_id = "local-commentum-d1"
migrations_dir = "drizzle"

[vars]
JWT_SECRET = "commentum_super_secret_jwt_key_change_in_prod"
ENVIRONMENT = "development"
